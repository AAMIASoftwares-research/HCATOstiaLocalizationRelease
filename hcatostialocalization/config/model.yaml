# Swin UNETR V2 + DSNTJSDLoss — training spacing ablation (isotropic, 100 epochs).
# `extends: <name>` = inherits EVERYTHING from the parent experiment (deep merge, see config/config.py);
# only fields that change are written here. Lists (e.g. crop_probs) are fully replaced.
# Intentionally NOT rescaled relative to the parent: sigma (2.0 vox), elastic_max_voxels (2.0 vox), centroid
# window (11 vox), patch 128³ — remain in voxels, so in mm they change with spacing.
# Spacing is NOT here: it is passed via CLI to the dedicated trainer (trainer_ablation_training_spacing, --spacing-iso <mm>);
# run name and checkpoint folder: <experiment>_ablation_training_spacing_<S>mm.
  swin_unetr_v2_dsnt_ablation_training_spacing:
    extends: swin_unetr_v2_dsnt
    train:
      epochs: 100                    # shorter ablation (baseline uses 200)


# Swin UNETR V2 + DSNTJSDLoss — loss weight ablation: FIXED (w_R = w_L = 0.5 for all 200 epochs,
# no sinh_plateau rebalancing). The parent swin_unetr_v2_dsnt is the DYNAMIC variant. Same epochs as parent
# (200), because the "Dynamic" row of weight_comparison.tex is the final 200-epoch run.
  swin_unetr_v2_dsnt_ablation_fixed_weights:
    extends: swin_unetr_v2_dsnt
    loss:
      sinh_plateau:
        enabled: false


