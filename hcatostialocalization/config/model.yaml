# <-- Change here to switch experiment
active_experiment: "swin_unetr_v2_dsnt"
# Available choices from the paper:
# - swin_unetr_v2_dsnt
# - swin_unetr_v2_dsnt_ablation_training_spacing      (training spacing ablation, 100 epochs; spacing via --spacing-iso, see sbatch-train-ablation-training-spacing.sh)
# - swin_unetr_v2_dsnt_ablation_fixed_weights          (loss weight ablation: fixed 0.5/0.5, 200 epochs)
# - dynunet_dsnt               (actually unused)
# - nnunet_residualunet_dsnt
# - resnet50_dsnt
# - resnet101_dsnt
# - mednext_s_dsnt
# - mednext_b_dsnt
# - mednext_m_dsnt

resume:
  enabled: false
  checkpoint_path: null         # Specify a path to resume from a specific file, otherwise auto_latest will look for the latest last_model.pth
  auto_latest: false





# ====================================================================


experiments:

# nnUNet Debug Configuration
  dynunet_debug:
    model:
      name: "dynunet"
      img_size: [128, 128, 128]
      in_channels: 1
      out_channels: 3
      # filters: [16, 32, 64, 128, 256]   # optional, last value = bottleneck channels; default shown
      final_activation: "none"

    loss:
      name: "hybrid_ce_bce"
      ce_weight: 0.33
      bce_weight: 0.33
      dice_weight: 0.34            # <-- Kept as per original
      foreground_weight: 100.0

    train:
      epochs: 200
      batch_size: 1
      gradient_accumulation_steps: 4
      num_workers: 8
      max_train_steps: null
      max_val_steps: null
      log_images: true
      log_images_per_epoch: 5
      save_checkpoints: true
      crop_probs: [0.32, 0.34, 0.34]
      gradient_clip_norm: 1.0
      val_every_n_epochs: 5
      outlier_threshold_mm: 15.0
      best_warmup_epochs: 10
      sigma_start: 2.0
      sigma_reduction_factor: 1.0
      sigma_min_improvement: 0.05
      sigma_patience: 2
      sigma_warmup_epochs: 5
      augmentation:                  # data/transform/augment_3d_ostia.py — applied to patches after cropping
        enabled: true
        max_rotation_deg: 15.0       # random per-axis rotation in [-15°, +15°] (no flip / rot90: RAS is informative for R vs L)
        zoom_range: [0.9, 1.1]
        elastic_max_voxels: 2.0      # maximum elastic displacement (voxels; 2 vox = 1 mm at 0.5 mm spacing)
        elastic_grid_points: 5       # nodes per axis of the coarse elastic field (more nodes = less smooth deformation)
        noise_std_hu: 40.0           # noise std ~ |N(0, 40)| HU
        shift_std_hu: 5.0            # global shift ~ N(0, 5) HU
        p_affine: 0.8                # per-sample probability: rotation + zoom
        p_elastic: 0.3
        p_noise: 0.5
        p_shift: 0.5

    optimizer:
      name: "adamw"
      learning_rate: 0.00005
      weight_decay: 0.00001          # <-- FIX: aligned with swin_unetr_v2 (was 0.05)

    scheduler:
      name: "custom_warmup"
      warmup_steps: 8000


# nnU-Net V2 ResidualUNet (dynamic_network_architectures, real nnU-Net residual encoder) + 3D DSNT training configuration
  nnunet_residualunet_dsnt:
    model:
      name: "nnunet_residualunet"
      img_size: [128, 128, 128]
      in_channels: 1
      out_channels: 3
      n_stages: 5
      features_per_stage: [32, 64, 128, 256, 320]
      kernel_sizes: [[3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3]]
      strides: [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
      n_blocks_per_stage: [2, 2, 3, 2, 2]
      n_conv_per_stage_decoder: [2, 2, 2, 2]
      final_activation: "none"

    loss:
      name: "dsnt_jsd"
      lambda_jsd: 1.0                # JSD term weight
      sigma_jsd_R: 2.0               # R channel sigma (voxels) — must match sigma_start
      sigma_jsd_L: 2.0               # L channel sigma (voxels) — larger for LMCA variability
      lambda_bg: 0.8                 # background BCE weight (background noise suppression)
      temperature: 0.3               # spatial softmax temperature (< 1.0 = sharper)
      weight_R: 0.5                  # R channel weight in total loss
      weight_L: 0.5                  # L channel weight (anatomically harder)
      weight_switch_epoch: null      # Disabled: replaced by sinh_plateau dynamically
      min_heatmap_sum: 0.001         # lowered threshold to include Gaussians truncated at borders
      sinh_plateau:
        enabled: true
        patience: 3                  # Stall epochs before confirming the plateau
        min_delta_mm: 0.1            # Minimum global improvement
        warmup_epochs: 15            # Waits 15 convergence epochs before monitoring
        activation_delay_epochs: 3   # Waits 3 epochs from detection before starting to move weights
        a_min: 0.1
        a_max: 1.5
        max_weight: 0.75             # Hard limits: weights confined in [0.25, 0.75]
        smoothing: 0.5               # Intermediate step: (w_current + w_target) / 2

    train:
      epochs: 200
      batch_size: 1
      gradient_accumulation_steps: 4
      num_workers: 8
      max_train_steps: null
      max_val_steps: null
      log_images: true
      log_images_per_epoch: 5
      save_checkpoints: true
      crop_probs: [0.32, 0.34, 0.34]
      gradient_clip_norm: 1.0
      val_every_n_epochs: 5
      outlier_threshold_mm: 15.0
      best_warmup_epochs: 10
      sigma_start: 2.0
      sigma_reduction_factor: 1.0
      sigma_min_improvement: 0.05
      sigma_patience: 2
      sigma_warmup_epochs: 5
      augmentation:                  # data/transform/augment_3d_ostia.py — applied to patches after cropping
        enabled: true
        max_rotation_deg: 15.0       # random per-axis rotation in [-15°, +15°] (no flip / rot90: RAS is informative for R vs L)
        zoom_range: [0.9, 1.1]
        elastic_max_voxels: 2.0      # maximum elastic displacement (voxels; 2 vox = 1 mm at 0.5 mm spacing)
        elastic_grid_points: 5       # nodes per axis of the coarse elastic field (more nodes = less smooth deformation)
        noise_std_hu: 40.0           # noise std ~ |N(0, 40)| HU
        shift_std_hu: 5.0            # global shift ~ N(0, 5) HU
        p_affine: 0.8                # per-sample probability: rotation + zoom
        p_elastic: 0.3
        p_noise: 0.5
        p_shift: 0.5

    optimizer:
      name: "adamw"
      learning_rate: 0.00005
      weight_decay: 0.00001

    scheduler:
      name: "custom_warmup"
      warmup_steps: 8000


