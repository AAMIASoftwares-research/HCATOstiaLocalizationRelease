# Swin UNETR V2 + DSNTJSDLoss — ablation sullo spacing di training (isotropo, 100 epoche).
# `extends: <nome>` = eredita TUTTO dall'esperimento padre (merge profondo, vedi config/config.py);
# qui si scrivono solo i campi che cambiano. Le liste (es. crop_probs) vengono sostituite per intero.
# Di proposito NON riscalati rispetto al padre: sigma (2.0 vox), elastic_max_voxels (2.0 vox), finestra del
# centroide (11 vox), patch 128³ — restano in voxel, quindi in mm cambiano con lo spacing.
# Lo spacing NON sta qui: si passa da CLI al trainer dedicato (trainer_ablation_training_spacing, --spacing-iso <mm>);
# nome del run e cartella checkpoint: <esperimento>_ablation_training_spacing_<S>mm.
  swin_unetr_v2_dsnt_ablation_training_spacing:
    extends: swin_unetr_v2_dsnt
    train:
      epochs: 100                    # ablation più corta (il baseline usa 200)


# Swin UNETR V2 + DSNTJSDLoss — ablation pesi della loss: FISSI (w_R = w_L = 0.5 per tutte le 200 epoche,
# nessun riequilibrio sinh_plateau). Il padre swin_unetr_v2_dsnt è la variante DINAMICA. Stesse epoche del padre
# (200), perché la riga "Dynamic" di weight_comparison.tex è il run finale da 200 epoche.
  swin_unetr_v2_dsnt_ablation_fixed_weights:
    extends: swin_unetr_v2_dsnt
    loss:
      sinh_plateau:
        enabled: false


