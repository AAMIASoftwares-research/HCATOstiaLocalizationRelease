# CAT08 — split definition, the ONLY place that decides which files a case uses.
#
# Every entry is one case: an explicit (image, label) pair.
#   image: the CT volume
#   label: the ostium annotation in the standard .ostium.json format
# Paths are relative to `data_root` of the current machine (config/machine.yaml;
# on cluster: /path/to/data). Absolute paths also work.
# Loaded by data/dataset/CAT08/Multi_Dataset_CAT08.py via LabeledDataset._data_pool_from_split_yaml;
# the file location is set in config/dataset.yaml -> dataset.CAT08.yaml_path.

